<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#5B32A3">
  <title>Pune Smile Day · Smile Wall</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@600;700&family=Poppins:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- ============ HOME: SMILE WALL ============ -->
  <main id="view-wall" class="screen screen--home" data-view="wall">
    <div class="blob blob--a" aria-hidden="true"></div>
    <div class="blob blob--b" aria-hidden="true"></div>
    <div class="skyline" aria-hidden="true"></div>

    <img class="top-logo" src="assets/sakal-logo-white.png" alt="Sakal" width="102" height="26">
    <p class="date-chip" id="date-chip">1 Nov- 9:00 AM</p>
    <img class="logo-badge" src="assets/sakal-logo-white.png" alt="" aria-hidden="true" width="78" height="20">
    <h1 class="home-logo"><img src="assets/pune-smile-day-logo.svg" alt="Pune Smile Day" width="216" height="154"></h1>

    <h2 class="wall-title">The Wall of Smiles</h2>
    <div class="wall-bar"><span class="wall-bar__name">Smile Wall</span><span class="wall-bar__count" id="smile-count" aria-live="polite"></span></div>

    <section class="carousel" aria-label="Photos on the Smile Wall">
      <button type="button" class="car-btn car-btn--prev" id="car-prev" aria-label="Previous photos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <ul class="carousel__track" id="wall-grid" aria-live="polite"></ul>
      <button type="button" class="car-btn car-btn--next" id="car-next" aria-label="More photos">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
      </button>
    </section>

    <a href="#camera" class="cta" aria-label="Make your Smile Frame. Your photo joins the wall">
      <span class="cta__pill">
        <span class="cta__title">Make your Smile Frame</span>
        <span class="cta__sub">Your photo joins the wall
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l6 6-6 6M13 6l6 6-6 6"/></svg>
        </span>
      </span>
      <span class="cta__icon"><svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-camera"/></svg></span>
    </a>

    <p class="tags" id="home-tags"></p>

    <p class="powered">powered by <img src="assets/sakal-logo-white.png" alt="Sakal" width="102" height="26"></p>
  </main>

  <!-- ============ CAMERA: SMILE FRAME ============ -->
  <main id="view-camera" class="screen screen--camera" data-view="camera" hidden>
    <img class="ghost ghost--a" src="assets/emoji/grinning_squinting_face.webp" alt="" aria-hidden="true">
    <img class="ghost ghost--b" src="assets/stickers/heart-eyes.png" alt="" aria-hidden="true">
    <div class="skyline" aria-hidden="true"></div>

    <a href="#wall" class="back-btn">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 12H5M11 6l-6 6 6 6"/></svg>
      <span>Smile Wall</span>
    </a>
    <span class="live-tag">LIVE</span>

    <h1 class="camera__title" id="camera-title" aria-live="polite">Look at the camera<br>&amp; smile big</h1>

    <div class="stage" id="stage">
      <video id="video" class="stage__video" playsinline muted autoplay></video>
      <canvas id="frame-canvas" class="stage__frame" aria-hidden="true"></canvas>
      <div id="countdown" class="stage__countdown" hidden aria-live="assertive"></div>
      <div id="flash" class="stage__flash" aria-hidden="true"></div>
      <div id="camera-error" class="stage__error" hidden>
        <p id="camera-error-msg">We couldn’t open the camera.</p>
        <button type="button" id="btn-retry-camera" class="btn btn--download">Try again</button>
      </div>
    </div>


    <div id="controls-ready">
      <button type="button" id="btn-shutter" class="shutter" aria-label="Capture photo, 3-second countdown">
        <svg viewBox="0 0 24 24" aria-hidden="true"><use href="#icon-camera"/></svg>
      </button>
      <p class="hint">Tap to capture - 3 second countdown</p>
    </div>

    <p id="controls-counting" class="hold" hidden>Hold that smile…</p>

    <div id="controls-review" hidden>
      <button type="button" id="btn-add" class="btn btn--add">Add to the Smile Wall</button>
      <button type="button" id="btn-retake" class="btn btn--retake">Retake</button>
      <button type="button" id="btn-download" class="btn btn--download">Download</button>
      <button type="button" id="btn-share" class="btn btn--share">Share</button>
    </div>

    <p class="powered">powered by <img src="assets/sakal-logo-white.png" alt="Sakal" width="102" height="26"></p>
  </main>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="icon-camera" viewBox="0 0 24 24">
      <path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3l-2.5-3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="12" cy="13" r="3.8" fill="none" stroke="currentColor" stroke-width="1.8"/>
    </symbol>
  </svg>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
